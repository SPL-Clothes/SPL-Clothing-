<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SPL Clothing</title>
  <style>
    body { margin:0; font-family:Arial, sans-serif; background:#111; color:#fff; }
    header { background:#000; padding:20px; text-align:center; font-size:2rem; letter-spacing:3px; }
    nav { text-align:center; margin-top:10px; }
    nav a { color:white; margin:0 15px; text-decoration:none; font-size:1.2rem; }
    .hero {
      background:linear-gradient(135deg,#444,#000);
      padding:100px 20px;
      text-align:center;
    }
    .hero h1 { font-size:3rem; margin-bottom:10px; }
    .hero p { font-size:1.3rem; opacity:0.8; }
    .products { display:flex; justify-content:center; flex-wrap:wrap; padding:40px 10px; gap:30px; }
    .product {
      background:#222; padding:20px; border-radius:10px; width:250px; text-align:center;
      transition:transform .2s;
    }
    .product:hover { transform:scale(1.05); }
    .product img { width:100%; border-radius:10px; }
    button {
      margin-top:10px; padding:10px 20px; border:none; background:#0af; color:#000;
      border-radius:5px; cursor:pointer; font-weight:bold;
    }
    footer { text-align:center; padding:20px; background:#000; margin-top:40px; }
  </style>
</head>
<body>
  <header>SPL CLOTHING</header>

  <nav>
    <a href="#shop">Shop</a>
    <a href="#checkout">Checkout</a>
  </nav>

  <section class="hero">
    <h1>Fresh Fits. Clean Style.</h1>
    <p>Premium streetwear designed for real ones.</p>
  </section>

  <section id="shop" class="products">
    <div class="product">
      <img src="https://via.placeholder.com/250x250.png?text=Hoodie" />
      <h3>SPL Hoodie</h3>
      <p>$49.99</p>
      <button onclick="addToCart('SPL Hoodie', 49.99)">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/250x250.png?text=T-Shirt" />
      <h3>SPL Tee</h3>
      <p>$24.99</p>
      <button onclick="addToCart('SPL Tee', 24.99)">Add to Cart</button>
    </div>

    <div class="product">
      <img src="https://via.placeholder.com/250x250.png?text=Hat" />
      <h3>SPL Hat</h3>
      <p>$19.99</p>
      <button onclick="addToCart('SPL Hat', 19.99)">Add to Cart</button>
    </div>
  </section>

  <section id="checkout" style="padding:40px; text-align:center;">
    <h2>Your Cart</h2>
    <div id="cart"></div>
    <h3 id="total"></h3>
    <button onclick="checkout()">Checkout</button>
  </section>

  <footer>© 2025 SPL Clothing</footer>

  <script>
    let cart = [];

    function addToCart(name, price) {
      cart.push({ name, price });
      updateCart();
    }

    function updateCart() {
      const cartDiv = document.getElementById("cart");
      cartDiv.innerHTML = cart.map(item => 
        `<p>${item.name} - $${item.price.toFixed(2)}</p>`
      ).join("");

      const total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById("total").innerText = 
        cart.length ? "Total: $" + total.toFixed(2) : "";
    }

    function checkout() {
      alert("Thanks for your purchase! (This is a demo checkout.)");
    }
  </script>

</body>
</html>
